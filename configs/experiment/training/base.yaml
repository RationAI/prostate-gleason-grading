# @package _global_

defaults:
  - /callbacks/aggregation
  - /callbacks/checkpointing
  - /callbacks/early_stopping
  - /callbacks/aggregators@callbacks.aggregation.aggregators.pure_aggregator: pure

mode: fit

checkpoint: null

model_name: ???

data:
  dataset:
    name: ???

trainer:
  enable_checkpointing: True
  enable_progress_bar: True
  enable_model_summary: True
  log_every_n_steps: 5
  val_check_interval: 0.2

metadata:
  run_name: "${model_name} ${data.dataset.name} seed=${seed}"
  description: "${model_name} model trained on ${data.dataset.name} dataset"
