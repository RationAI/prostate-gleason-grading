# @package _global_

defaults:
  - /data/mmci2k_224@data
  - /datamodule/embedding_datamodule@datamodule
  - /callbacks/heatmaps
  - /model/virchow2_lbfgs@model
  - _self_

mode: predict

checkpoint: ???

datamodule:
  batch_size: 1024
  num_workers: 1
  drop_last: false
  shuffle: false
  sampler: null
  invert_fold_selection: true
  predict:
    uris: null
    paths: ["/mnt/projects/prostate_cancer/gleason/embeddings/virchow2_tiling_splits/train"]
    embeddings_col: virchow2_embedding

model:
  lr: 1
  weight_decay: ???
  cache_on_cpu: true
  early_stopping: true
  lbfgs_kwargs:
    max_iter: 20
    history_size: 100
    tolerance_grad: 1.0e-7
    tolerance_change: 1.0e-9

trainer:
  deterministic: true
  use_distributed_sampler: False
  devices: 1
  num_nodes: 1
  limit_train_batches: 1.0
  overfit_batches: 0.0
  min_epochs: 1
  val_check_interval: 1.0
  check_val_every_n_epoch: 1

metadata:
  run_name: "Prediction heatmaps"
  description: "prediction heatmaps"
