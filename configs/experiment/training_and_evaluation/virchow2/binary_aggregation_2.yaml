# @package _global_

defaults:
  - /experiment/training_and_evaluation/virchow2/data/TL: ???
  - /experiment/training_and_evaluation/virchow2/model/TL: ???
  - /callbacks/aggregation_callback
  - /callbacks/aggregators/binary/mean_pool_max@callbacks.aggregation.aggregators.mean_pool_max_6
  - /callbacks/aggregators/binary/mean_pool_max@callbacks.aggregation.aggregators.mean_pool_max_7
  - /callbacks/aggregators/binary/mean_pool_top_k@callbacks.aggregation.aggregators.mean_pool_top_2
  - /callbacks/aggregators/binary/mean_pool_top_k@callbacks.aggregation.aggregators.mean_pool_top_3
  - /callbacks/aggregators/binary/mean_pool_top_k@callbacks.aggregation.aggregators.mean_pool_top_5
  - /callbacks/aggregators/binary/mean_pool_top_k@callbacks.aggregation.aggregators.mean_pool_top_10
  - _self_

callbacks:
  aggregation:
    aggregators:
      mean_pool_max_6:
        prediction_threshold: ${prediction_threshold}
        kernel_size: 6
      mean_pool_max_7:
        prediction_threshold: ${prediction_threshold}
        kernel_size: 7
      mean_pool_top_2:
        prediction_threshold: ${prediction_threshold}
        kernel_size: 4
        k: 2
      mean_pool_top_3:
        prediction_threshold: ${prediction_threshold}
        kernel_size: 4
        k: 3
      mean_pool_top_5:
        prediction_threshold: ${prediction_threshold}
        kernel_size: 4
        k: 5
      mean_pool_top_10:
        prediction_threshold: ${prediction_threshold}
        kernel_size: 4
        k: 10

prediction_threshold: 0

mode: test

checkpoint: ???

metadata:
  run_name: "BINARY TOPK AGGREGATION: ${model_name} ${data.dataset.name}"
  description: "BINARY TOPK AGGREGATION: ${model_name} ${data.dataset.name}"
