# @package _global_

defaults:
  - /data/mmci2k_224@data
  - /datamodule/embedding_datamodule@datamodule
  - _self_

validation_fold: ???

datamodule:
  batch_size: 1024
  num_workers: 8
  train:
    uris: ["${data.dataset.mlflow_uris.embeddings.virchow2_tiling_splits_mixed_gs}/train"]
    paths: null
    embeddings_col: virchow2_embedding
    fold: ${validation_fold}
    invert_fold_selection: True
  val:
    uris: ["${data.dataset.mlflow_uris.embeddings.virchow2_tiling_splits_mixed_gs}/train"]
    paths: null
    embeddings_col: virchow2_embedding
    fold: ${validation_fold}
    invert_fold_selection: False
  test:
    uris: ["${data.dataset.mlflow_uris.embeddings.virchow2_tiling_splits_mixed_gs}/test"]
    paths: null
    embeddings_col: virchow2_embedding
    fold: null
    invert_fold_selection: False
  predict:
    uris: ["${data.dataset.mlflow_uris.embeddings.virchow2_tiling_splits_mixed_gs}/test"]
    paths: null
    embeddings_col: virchow2_embedding
    fold: null
    invert_fold_selection: False
