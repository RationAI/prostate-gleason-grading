# @package _global_

defaults:
  - /model/virchow2_lbfgs@model
  - /callbacks/checkpointing
  - _self_

datamodule:
  drop_last: false
  shuffle: false
  sampler: null

trainer:
  enable_checkpointing: True
  enable_progress_bar: True
  enable_model_summary: True
  deterministic: true
  use_distributed_sampler: False
  devices: 1
  num_nodes: 1
  limit_train_batches: 1.0
  overfit_batches: 0.0
  min_epochs: 1
  val_check_interval: 1.0
  check_val_every_n_epoch: 1

model_name: "Virchow2-LBFGS"
model:
  weight_decay: ???

metadata:
  run_name: "Stage=${mode} Model=${model_name} Data=${data.dataset.name} ValidationFold=${validation_fold} WD=${model.weight_decay} Seed=${seed}"
