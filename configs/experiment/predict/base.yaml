# @package _global_

defaults:
  - /callbacks/aggregation
  - /callbacks/classify_heatmap
  - /callbacks/cond_prob_heatmap
  - /callbacks/raw_prob_heatmap
  - _self_
  - /callbacks/aggregators@callbacks.aggregation.aggregators.mixed_aggregator: mixed

callbacks:
  aggregation:
    log_table: True

mode: predict

model_name: ???

data:
  dataset:
    name: ???

metadata:
  run_name: "$Predictions - {model_name} ${data.dataset.name}"
  description: "${model_name} model predictions on ${data.dataset.name} dataset"
