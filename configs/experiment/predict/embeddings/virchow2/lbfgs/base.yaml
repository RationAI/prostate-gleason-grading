# @package _global_

defaults:
  - /experiment/predict/embeddings/base
  - /model/virchow2_lbfgs@model
  - _self_

model_name: "Virchow2 (LBFGS)"

model:
  lr: 0.0
  weight_decay: 0.0
  cache_on_cpu: true
  early_stopping: true
  lbfgs_kwargs:
    max_iter: 20
    history_size: 100
    tolerance_grad: 1.0e-7
    tolerance_change: 1.0e-9
