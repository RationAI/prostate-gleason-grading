# @package _global_

defaults:
  - /experiment/predict/base
  - /datamodule/embedding_datamodule@datamodule
  - _self_

fold: null
invert_fold_selection: False

datamodule:
  batch_size: 1024
  num_workers: 2
  drop_last: false
  shuffle: false
  sampler: null

metadata:
  run_name: "Predictions - ${model_name} ${data.dataset.name} fold=${fold} inverse=${invert_fold_selection}"
